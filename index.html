<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>非夾不可後台帳務核對系統 (完整旗艦版)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sidebar-active { background-color: #3b82f6 !important; color: white !important; }
        .modal-backdrop { background-color: rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- 1. 登入彈窗 (系統啟動時顯示) -->
    <div id="loginModal" class="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="bg-slate-900 text-white p-6 text-center">
                <i class="fa-solid fa-store text-4xl text-blue-400 mb-2"></i>
                <h2 class="text-2xl font-bold">非夾不可後台帳務系統</h2>
                <p class="text-slate-400 text-xs mt-1">請選擇登入角色並輸入對應密碼以進入系統</p>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">選擇登入角色</label>
                    <select id="loginRoleSelect" class="w-full border border-slate-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none mb-3">
                        <option value="boss">👑 會計 / 店長</option>
                        <option value="counter">🏪 櫃台人員</option>
                        <option value="warehouse">📦 倉管人員</option>
                        <option value="buyer">🛒 採購人員</option>
                    </select>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">輸入密碼</label>
                    <input type="password" id="loginPasswordInput" class="w-full border border-slate-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="請輸入密碼">
                </div>
                <button onclick="performLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition duration-200 cursor-pointer">
                    登入系統
                </button>
            </div>
        </div>
    </div>

    <!-- 頂部導覽列 -->
    <header class="bg-slate-800 text-white flex justify-between items-center px-6 py-3 shadow-md sticky top-0 z-30">
        <div class="flex items-center space-x-3">
            <i class="fa-solid font-bold text-2xl text-blue-400 fa-store"></i>
            <h1 class="text-xl font-bold tracking-wide">非夾不可後台帳務核對系統</h1>
        </div>
        <div class="flex items-center space-x-4">
            <!-- 雲端同步按鈕 -->
            <button onclick="syncWithCloud()" id="syncBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium flex items-center space-x-2 transition shadow-sm cursor-pointer">
                <i class="fa-solid fa-cloud-arrow-up" id="syncIcon"></i>
                <span id="syncText">雲端同步正常</span>
            </button>

            <!-- 多分店切換 -->
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-location-dot text-yellow-400"></i>
                <label for="storeSelect" class="text-sm font-medium">當前分店：</label>
                <select id="storeSelect" onchange="switchStore()" class="bg-slate-700 text-white rounded px-3 py-1 text-sm border border-slate-600 focus:outline-none cursor-pointer">
                    <option value="store_main">總店 (旗艦店)</option>
                    <option value="store_ximen">西門分店</option>
                    <option value="store_fengjia">逢甲分店</option>
                </select>
            </div>

            <!-- 角色權限切換 -->
            <div class="flex items-center space-x-2 bg-slate-700 px-3 py-1 rounded-lg border border-slate-600">
                <i class="fa-solid fa-user-shield text-blue-400"></i>
                <span class="text-sm">切換角色：</span>
                <select id="roleSelect" onchange="switchRole()" class="bg-slate-800 text-white rounded px-2 py-1 text-sm border border-slate-500 focus:outline-none cursor-pointer">
                    <option value="boss">會計 / 店長</option>
                    <option value="counter">櫃台人員</option>
                    <option value="warehouse">倉管人員</option>
                    <option value="buyer">採購人員</option>
                </select>
            </div>

            <!-- 登出按鈕 -->
            <button onclick="logout()" class="bg-slate-700 hover:bg-rose-600 text-slate-300 hover:text-white px-3 py-1 rounded-lg text-sm transition">
                <i class="fa-solid fa-right-from-bracket"></i> 登出
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- 側邊選單 -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between p-4 shadow-lg shrink-0">
            <nav class="space-y-1 overflow-y-auto max-h-[calc(100vh-100px)]" id="sidebarNav">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-3 mb-2">系統模組</div>
                
                <button onclick="switchTab('tab-purchase')" id="nav-purchase" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition hover:bg-slate-800 sidebar-active cursor-pointer">
                    <i class="fa-solid fa-cart-flatbed w-5 text-center"></i>
                    <span class="font-medium">預定進貨表 (叫貨)</span>
                </button>

                <button onclick="switchTab('tab-stock')" id="nav-stock" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition hover:bg-slate-800 cursor-pointer">
                    <i class="fa-solid fa-boxes-stacked w-5 text-center"></i>
                    <span class="font-medium">庫存與出入庫管理</span>
                </button>

                <button onclick="switchTab('tab-stocktake')" id="nav-stocktake" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition hover:bg-slate-800 cursor-pointer">
                    <i class="fa-solid fa-clipboard-check w-5 text-center"></i>
                    <span class="font-medium">實際盤點與盤差</span>
                </button>

                <button onclick="switchTab('tab-machines')" id="nav-machines" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition hover:bg-slate-800 cursor-pointer">
                    <i class="fa-solid fa-gamepad w-5 text-center"></i>
                    <span class="font-medium">機台每日幣量與分析</span>
                </button>

                <button onclick="switchTab('tab-supplier')" id="nav-supplier" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition hover:bg-slate-800 cursor-pointer">
                    <i class="fa-solid fa-truck-field w-5 text-center"></i>
                    <span class="font-medium">廠商進貨明細表</span>
                </button>

                <button onclick="switchTab('tab-payment-check')" id="nav-payment-check" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition hover:bg-slate-800 cursor-pointer">
                    <i class="fa-solid fa-file-invoice-dollar w-5 text-center"></i>
                    <span class="font-medium">貨款與進貨金額核對</span>
                </button>

                <button onclick="switchTab('tab-cashflow')" id="nav-cashflow" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition hover:bg-slate-800 cursor-pointer">
                    <i class="fa-solid fa-vault w-5 text-center"></i>
                    <span class="font-medium">現金流核對</span>
                </button>

                <button onclick="switchTab('tab-accounting')" id="nav-accounting" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition hover:bg-slate-800 cursor-pointer">
                    <i class="fa-solid fa-calculator w-5 text-center"></i>
                    <span class="font-medium">會計損益與月報表</span>
                </button>
            </nav>

            <div class="border-t border-slate-800 pt-4 text-xs text-slate-500 text-center">
                非夾不可管理系統 v4.4 (雲端版)<br>© 2026 保留所有權利
            </div>
        </aside>

        <!-- 主內容區 -->
        <main class="flex-1 overflow-y-auto p-6 space-y-6">

            <!-- 1. 預定進貨表 (叫貨) -->
            <section id="tab-purchase" class="space-y-4 tab-section">
                <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <div>
                        <h2 class="text-xl font-bold text-slate-800">預定進貨表</h2>
                        <p class="text-sm text-slate-500">管理採購訂單、到貨登記與審核狀態</p>
                    </div>
                    <button onclick="openPurchaseModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition flex items-center space-x-2 cursor-pointer">
                        <i class="fa-solid fa-plus"></i>
                        <span>新增叫貨訂單</span>
                    </button>
                </div>

                <div id="unstockedAlert" class="hidden bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-lg shadow-sm">
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid fa-triangle-exclamation text-amber-600 text-xl"></i>
                        <div>
                            <h4 class="font-bold text-amber-800">警示：貨品已到貨，尚未完成入庫！</h4>
                            <p id="unstockedAlertText" class="text-sm text-amber-700"></p>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-4 items-center">
                    <div class="flex items-center space-x-2">
                        <label class="text-sm font-medium text-slate-600">狀態篩選：</label>
                        <select id="filterPurchaseStatus" onchange="renderPurchaseTable()" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm">
                            <option value="all">全部狀態</option>
                            <option value="待到貨">待到貨</option>
                            <option value="已到貨未入庫">已到貨未入庫</option>
                            <option value="高額待審核">高額待審核</option>
                            <option value="已完放入庫">已完放入庫</option>
                        </select>
                    </div>
                    <div class="flex items-center space-x-2">
                        <label class="text-sm font-medium text-slate-600">廠商搜尋：</label>
                        <input type="text" id="filterPurchaseSupplier" oninput="renderPurchaseTable()" placeholder="輸入廠商名稱..." class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm">
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
                            <tr>
                                <th class="p-3">訂單號/日期</th>
                                <th class="p-3">廠商</th>
                                <th class="p-3">商品/規格</th>
                                <th class="p-3">數量 / 單價</th>
                                <th class="p-3">總金額</th>
                                <th class="p-3">付款日期</th>
                                <th class="p-3">到貨/登記人</th>
                                <th class="p-3">狀態</th>
                                <th class="p-3 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="purchaseTableBody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </section>

            <!-- 2. 庫存與出入庫管理 -->
            <section id="tab-stock" class="space-y-4 tab-section hidden">
                <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <div>
                        <h2 class="text-xl font-bold text-slate-800">庫存與出入庫管理</h2>
                        <p class="text-sm text-slate-500">庫存查詢、刷碼快速搜尋與出庫管理</p>
                    </div>
                    <button onclick="openOutstockModal()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition flex items-center space-x-2 cursor-pointer">
                        <i class="fa-solid fa-boxes-packing"></i>
                        <span>商品出庫登記</span>
                    </button>
                </div>

                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-4 items-center">
                    <div class="flex-1 min-w-[280px] relative">
                        <i class="fa-solid fa-barcode absolute left-3 top-3 text-slate-400"></i>
                        <input type="text" id="stockSearchInput" oninput="renderStockTable()" placeholder="關鍵字模糊搜尋或直接刷條碼..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm">
                    </div>
                    <div>
                        <select id="stockUsageFilter" onchange="renderStockTable()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm">
                            <option value="all">全部用途</option>
                            <option value="機台貨">機台貨</option>
                            <option value="夾換台">夾換台</option>
                            <option value="點數兌換">點數兌換</option>
                        </select>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
                            <tr>
                                <th class="p-3">條碼</th>
                                <th class="p-3">商品名稱 / 規格</th>
                                <th class="p-3">用途</th>
                                <th class="p-3">區域</th>
                                <th class="p-3">廠商</th>
                                <th class="p-3">成本單價</th>
                                <th class="p-3">當前庫存</th>
                                <th class="p-3">預警狀態</th>
                            </tr>
                        </thead>
                        <tbody id="stockTableBody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </section>

            <!-- 3. 實際盤點與盤差 -->
            <section id="tab-stocktake" class="space-y-4 tab-section hidden">
                <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <div>
                        <h2 class="text-xl font-bold text-slate-800">每月庫存實際盤點</h2>
                        <p class="text-sm text-slate-500">依區域（1F、機台商品、B2、點
